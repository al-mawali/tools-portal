<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Studio</title>
<style>
:root{--bg:#f3f1ff;--panel:#fff;--ink:#1b1740;--mut:#6a6590;--line:#e0dcff;--acc:#6c4dff;--hot:#ff5c87;--mint:#19c9a0;--r:22px;color-scheme:light}
[data-theme=dark]{--bg:#0f0c24;--panel:#1a1640;--ink:#f1eeff;--mut:#a39ec9;--line:#312b66;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:16px/1.5 ui-rounded,"SF Pro Rounded","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(60rem 30rem at 85% -10%,color-mix(in srgb,var(--hot) 28%,transparent),transparent),radial-gradient(50rem 28rem at -10% 0,color-mix(in srgb,var(--acc) 30%,transparent),transparent),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px clamp(14px,3vw,32px) 40px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 22px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--hot));display:grid;place-items:center;box-shadow:0 8px 24px -8px var(--acc)}
h1{font-size:clamp(1.4rem,3vw,2rem);margin:0;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--mut);font-size:.9rem}
.sp{flex:1}
.chip,.ib{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.85rem}
.chip:hover,.ib:hover{border-color:var(--acc)}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.5vw,26px);box-shadow:0 20px 50px -30px rgba(60,30,160,.5)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--bg);border-radius:16px;margin-bottom:18px;scrollbar-width:none}
.tabs button{flex:1;white-space:nowrap;border:0;background:none;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--mut)}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--acc);box-shadow:0 4px 14px -6px rgba(60,30,160,.5)}
.pane{display:none;gap:12px;grid-template-columns:1fr 1fr}
.pane.on{display:grid}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 1}
.f.w{grid-column:1/-1}
label{font-size:.82rem;font-weight:700;color:var(--mut)}
input[type=text],input[type=url],input[type=tel],input[type=email],input[type=password],select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:0}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--bg);border:1.5px solid var(--line)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--hot));color:#fff;border:0}
details{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
input[type=color]{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:3px}
input[type=range]{accent-color:var(--acc)}
.pv{position:sticky;top:16px;text-align:center}
.stage{display:grid;place-items:center;padding:clamp(12px,3vw,22px);border-radius:18px;background:repeating-conic-gradient(var(--bg) 0 25%,transparent 0 50%) 0 0/20px 20px;min-height:260px}
canvas{max-width:100%;height:auto;border-radius:10px;box-shadow:0 12px 34px -14px rgba(0,0,0,.5)}
.empty{color:var(--mut);max-width:24ch}
.meta{color:var(--mut);font-size:.82rem;margin:12px 0}
.warn{color:var(--hot);font-weight:700;font-size:.85rem;min-height:1.3em}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hist{margin-top:18px;text-align:left}
.hist h2{font-size:.95rem;margin:0 0 8px}
.hist button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist button:hover{border-color:var(--acc)}
footer{text-align:center;color:var(--mut);margin-top:30px;font-size:.9rem}
footer b{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);max-width:520px;width:calc(100% - 28px);padding:24px}
dialog::backdrop{background:rgba(10,5,40,.6);backdrop-filter:blur(4px)}
.rel{border-left:3px solid var(--acc);padding-left:14px;margin:14px 0}
.rel h3{margin:0}.rel small{color:var(--mut)}.rel ul{margin:8px 0 0;padding-left:18px}
#pr{display:none}
@media(max-width:880px){.grid{grid-template-columns:1fr}.pv{position:static}}
@media(max-width:520px){.pane,.opts{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}.sub{display:none}}
@media print{body>*{display:none!important}body>#pr{display:block!important;text-align:center}#pr img{width:70vmin}}
@media(prefers-reduced-motion:no-preference){.stage canvas{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.94);opacity:.4}}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 7 7" fill="#fff"><path d="M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM4 4h1.5v1.5H4zM5.5 5.5H7V7H5.5z"/></svg></div>
 <div><h1>QR Studio</h1><div class="sub">Links, Wi-Fi and contacts. Private and offline.</div></div>
 <span class="sp"></span>
 <button class="chip" id="verBtn" title="What's new">v1.0.0</button>
 <button class="ib" id="theme" aria-label="Toggle theme">◐</button>
</header>

<div class="grid">
<section class="card">
 <div class="tabs" role="tablist" id="tabs"></div>

 <div class="pane" data-p="link"><div class="f w"><label for="url">Website or link</label><input id="url" type="text" inputmode="url" placeholder="example.com/menu"></div></div>

 <div class="pane" data-p="wifi">
  <div class="f w"><label for="ssid">Network name (SSID)</label><input id="ssid" type="text" autocomplete="off"></div>
  <div class="f w"><label for="pw">Password</label><div class="row"><input id="pw" type="password" autocomplete="off"><button class="btn" id="eye" type="button">Show</button><button class="btn" id="gen" type="button">Generate</button></div></div>
  <div class="f"><label for="sec">Security</label><select id="sec"><option>WPA</option><option>WEP</option><option value="nopass">None</option></select></div>
  <div class="f"><label for="hid">Hidden network</label><select id="hid"><option value="false">No</option><option value="true">Yes</option></select></div>
 </div>

 <div class="pane" data-p="contact">
  <div class="f"><label for="fn">First name</label><input id="fn" type="text"></div>
  <div class="f"><label for="ln">Last name</label><input id="ln" type="text"></div>
  <div class="f"><label for="org">Company</label><input id="org" type="text"></div>
  <div class="f"><label for="job">Job title</label><input id="job" type="text"></div>
  <div class="f"><label for="tel">Phone</label><input id="tel" type="tel"></div>
  <div class="f"><label for="mail">Email</label><input id="mail" type="email"></div>
  <div class="f"><label for="web">Website</label><input id="web" type="text"></div>
  <div class="f"><label for="adr">Address</label><input id="adr" type="text"></div>
 </div>

 <div class="pane" data-p="email">
  <div class="f w"><label for="to">To</label><input id="to" type="email"></div>
  <div class="f w"><label for="sub">Subject</label><input id="sub" type="text"></div>
  <div class="f w"><label for="body">Message</label><textarea id="body"></textarea></div>
 </div>

 <div class="pane" data-p="text"><div class="f w"><label for="txt">Any text</label><textarea id="txt"></textarea></div></div>

 <details>
  <summary>Style and quality</summary>
  <div class="opts">
   <div class="f"><label for="fg">Code color</label><input id="fg" type="color" value="#1b1740"></div>
   <div class="f"><label for="bg">Background</label><input id="bg" type="color" value="#ffffff"></div>
   <div class="f"><label for="dot">Dot shape</label><select id="dot"><option value="0">Square</option><option value="2">Soft</option><option value="1">Round</option></select></div>
   <div class="f"><label for="ecc">Error correction</label><select id="ecc"><option value="0">Low (7%)</option><option value="1" selected>Medium (15%)</option><option value="2">Quartile (25%)</option><option value="3">High (30%)</option></select></div>
   <div class="f"><label for="size">Size: <span id="sv">512</span> px</label><input id="size" type="range" min="200" max="1600" step="50" value="512"></div>
   <div class="f"><label for="mar">Quiet zone: <span id="mv">4</span></label><input id="mar" type="range" min="0" max="10" value="4"></div>
  </div>
 </details>
</section>

<aside class="card pv">
 <div class="stage" id="stage"></div>
 <div class="meta" id="meta"></div>
 <div class="warn" id="warn" role="status"></div>
 <div class="acts">
  <button class="btn p" id="png">PNG</button><button class="btn" id="svg">SVG</button><button class="btn" id="cp">Copy</button><button class="btn" id="pt">Print</button>
 </div>
 <div class="hist" id="hist" hidden><h2>Recent codes</h2><div id="hl"></div></div>
</aside>
</div>

<footer>Developed by <b>Habib AlMawali</b> · Runs fully offline, nothing leaves this device</footer>
</div>

<dialog id="log"><h2 style="margin-top:0">Version change log</h2><div id="logb"></div><button class="btn p" id="logx">Close</button></dialog>
<div id="pr"><img alt="QR code"></div>

<script>
"use strict";
const VERSION="1.0.0";
// Add new releases at the top of this list.
const CHANGELOG=[{v:"1.0.0",d:"2026-11-22",n:["First release, fully offline in a single file","Link, Wi-Fi, contact (vCard), email and text codes","Colors, dot shapes, size, quiet zone and error correction","Download PNG or SVG, copy to clipboard, print","Recent codes list stored on this device","Light and dark themes, responsive layout","Wi-Fi password generator and contrast warning"]}];

/* ---- QR encoder (byte mode, versions 1-40, ECC L/M/Q/H) ---- */
const QR=(()=>{
const EC=[[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
[13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
const NB=[[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
[1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
[1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
const FB=[1,0,3,2];
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=(v/7|0)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
const dcw=(v,e)=>(raw(v)>>3)-EC[e][v-1]*NB[e][v-1];
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
const rsDiv=d=>{const r=new Array(d).fill(0);r[d-1]=1;let t=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],t);if(j+1<d)r[j]^=r[j+1]}t=mul(t,2)}return r};
const rsRem=(data,div)=>{const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r};
function pen(m,n){let p=0,dark=0;
 for(let a=0;a<2;a++)for(let i=0;i<n;i++){let run=1;for(let j=1;j<n;j++){const c=a?m[j][i]:m[i][j],q=a?m[j-1][i]:m[i][j-1];if(c==q){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(m[y][x])dark++;if(x<n-1&&y<n-1&&m[y][x]==m[y][x+1]&&m[y][x]==m[y+1][x]&&m[y][x]==m[y+1][x+1])p+=3}
 return p+Math.floor(Math.abs(dark*20-n*n*10)/(n*n))*10}
function make(text,e){
 const b=[...new TextEncoder().encode(text)];let v=1;
 for(;;v++){if(v>40)throw Error("Too much data for one QR code. Shorten it or lower error correction.");if(4+(v<10?8:16)+b.length*8<=dcw(v,e)*8)break}
 const cap=dcw(v,e)*8,bits=[],put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
 put(4,4);put(b.length,v<10?8:16);b.forEach(x=>put(x,8));put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
 for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
 const d=[];for(let i=0;i<bits.length;i+=8)d.push(parseInt(bits.slice(i,i+8).join(""),2));
 const nb=NB[e][v-1],el=EC[e][v-1],rc=raw(v)>>3,ns=nb-rc%nb,sl=(rc/nb)|0,div=rsDiv(el),blocks=[];
 for(let i=0,k=0;i<nb;i++){const l=sl-el+(i<ns?0:1),dat=d.slice(k,k+l);k+=l;const ec=rsRem(dat,div);if(i<ns)dat.push(0);blocks.push(dat.concat(ec))}
 const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((bl,j)=>{if(i!=sl-el||j>=ns)all.push(bl[i])});
 const n=v*4+17,m=Array.from({length:n},()=>new Array(n).fill(false)),fn=Array.from({length:n},()=>new Array(n).fill(false));
 const set=(x,y,c)=>{m[y][x]=c;fn[y][x]=true},bit=(x,i)=>((x>>>i)&1)!=0;
 for(let i=0;i<n;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
 for(const [cx,cy] of [[3,3],[n-4,3],[3,n-4]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy,t=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<n&&y>=0&&y<n)set(x,y,t!=2&&t!=4)}
 const na=v==1?0:(v/7|0)+2,step=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2,ap=na?[6]:[];
 for(let p=n-7;ap.length<na;p-=step)ap.splice(1,0,p);
 ap.forEach((cy,i)=>ap.forEach((cx,j)=>{if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}));
 const fmt=mk=>{const dt=FB[e]<<3|mk;let r=dt;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const bs=(dt<<10|r)^0x5412;
  for(let i=0;i<=5;i++)set(8,i,bit(bs,i));set(8,7,bit(bs,6));set(8,8,bit(bs,7));set(7,8,bit(bs,8));for(let i=9;i<15;i++)set(14-i,8,bit(bs,i));
  for(let i=0;i<8;i++)set(n-1-i,8,bit(bs,i));for(let i=8;i<15;i++)set(8,n-15+i,bit(bs,i));set(8,n-8,true)};
 fmt(0);
 if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const bs=v<<12|r;for(let i=0;i<18;i++){const c=bit(bs,i),a=n-11+i%3,q=(i/3)|0;set(a,q,c);set(q,a,c)}}
 let i=0;for(let r=n-1;r>=1;r-=2){if(r==6)r=5;for(let vt=0;vt<n;vt++)for(let j=0;j<2;j++){const x=r-j,y=((r+1)&2)==0?n-1-vt:vt;if(!fn[y][x]&&i<all.length*8){m[y][x]=bit(all[i>>>3],7-(i&7));i++}}}
 const MK=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>((x/3|0)+(y>>1))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const app=k=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fn[y][x]&&MK[k](x,y))m[y][x]=!m[y][x]};
 let best=0,bp=1e9;for(let k=0;k<8;k++){app(k);fmt(k);const p=pen(m,n);if(p<bp){bp=p;best=k}app(k)}
 app(best);fmt(best);return{n,m,v,bytes:b.length}}
return{make}})();

/* ---- App ---- */
const $=id=>document.getElementById(id);
const TABS=[["link","Link"],["wifi","Wi-Fi"],["contact","Contact"],["email","Email"],["text","Text"]];
let tab="link",qr=null;
const esc=s=>s.replace(/([\\;,:"])/g,"\\$1");
const ve=s=>s.replace(/([\\;,])/g,"\\$1");
const val=id=>$(id).value.trim();
const BUILD={
 link(){let u=val("url");if(!u)return"";return/^[a-z][a-z0-9+.-]*:/i.test(u)?u:"https://"+u},
 wifi(){const s=$("ssid").value;if(!s)return"";const t=val("sec"),p=t=="nopass"?"":`P:${esc($("pw").value)};`;return`WIFI:T:${t};S:${esc(s)};${p}H:${val("hid")};;`},
 contact(){const f=val("fn"),l=val("ln");if(!f&&!l&&!val("tel")&&!val("mail"))return"";
  const L=["BEGIN:VCARD","VERSION:3.0",`N:${ve(l)};${ve(f)};;;`,`FN:${ve((f+" "+l).trim())}`];
  if(val("org"))L.push("ORG:"+ve(val("org")));if(val("job"))L.push("TITLE:"+ve(val("job")));
  if(val("tel"))L.push("TEL;TYPE=CELL:"+val("tel"));if(val("mail"))L.push("EMAIL:"+val("mail"));
  if(val("web"))L.push("URL:"+val("web"));if(val("adr"))L.push("ADR:;;"+ve(val("adr"))+";;;;");L.push("END:VCARD");return L.join("\n")},
 email(){const t=val("to");if(!t)return"";const q=[];if(val("sub"))q.push("subject="+encodeURIComponent(val("sub")));if($("body").value)q.push("body="+encodeURIComponent($("body").value));return"mailto:"+t+(q.length?"?"+q.join("&"):"")},
 text(){return $("txt").value}
};
function shapes(q,st){const o=[],n=q.n,fd=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.m[y][x])o.push([fd(x,y)?0:st,x,y]);return o}
function paint(cv,q,px,mar,fg,bg,st){const t=q.n+2*mar,c=Math.max(1,Math.floor(px/t)),x=cv.getContext("2d");cv.width=cv.height=c*t;
 x.fillStyle=bg;x.fillRect(0,0,cv.width,cv.height);x.fillStyle=fg;
 for(const [s,i,j] of shapes(q,st)){const X=(i+mar)*c,Y=(j+mar)*c;
  if(s==1){x.beginPath();x.arc(X+c/2,Y+c/2,c*.47,0,7);x.fill()}
  else if(s==2&&x.roundRect){x.beginPath();x.roundRect(X,Y,c,c,c*.32);x.fill()}
  else x.fillRect(X,Y,c+(s?0:.5),c+(s?0:.5))}}
function toSVG(q,mar,fg,bg,st){const t=q.n+2*mar;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" width="${t*10}" height="${t*10}"><rect width="${t}" height="${t}" fill="${bg}"/><g fill="${fg}">`;
 for(const [k,i,j] of shapes(q,st)){const X=i+mar,Y=j+mar;s+=k==1?`<circle cx="${X+.5}" cy="${Y+.5}" r=".47"/>`:k==2?`<rect x="${X}" y="${Y}" width="1" height="1" rx=".32"/>`:`<rect x="${X}" y="${Y}" width="1.02" height="1.02"/>`}
 return s+"</g></svg>"}
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};

function render(){
 $("sv").textContent=$("size").value;$("mv").textContent=$("mar").value;
 const text=BUILD[tab](),st=$("stage");let w="";qr=null;
 if(!text){st.innerHTML='<p class="empty">Fill in the form and your code appears here instantly.</p>';$("meta").textContent="";$("warn").textContent="";setBtns(false);return}
 try{qr=QR.make(text,+$("ecc").value)}catch(e){st.innerHTML=`<p class="empty">${e.message}</p>`;$("meta").textContent="";setBtns(false);return}
 let cv=st.querySelector("canvas");if(!cv){st.innerHTML="";cv=document.createElement("canvas");cv.setAttribute("role","img");cv.setAttribute("aria-label","Generated QR code");st.appendChild(cv)}
 const prev=Math.min(+$("size").value,640);paint(cv,qr,prev,+$("mar").value,$("fg").value,$("bg").value,+$("dot").value);
 cv.style.width=Math.min(cv.width,360)+"px";
 $("meta").textContent=`${qr.n}×${qr.n} modules · ${qr.bytes} bytes · version ${qr.v}`;
 const a=lum($("fg").value),b=lum($("bg").value);
 if(a>=b)w="Code should be darker than its background to scan reliably.";else if((b+.05)/(a+.05)<3)w="Low contrast. Pick a darker code color.";
 $("warn").textContent=w;setBtns(true)}
function setBtns(on){["png","svg","cp","pt"].forEach(i=>$(i).disabled=!on)}
function full(){const c=document.createElement("canvas");paint(c,qr,+$("size").value,+$("mar").value,$("fg").value,$("bg").value,+$("dot").value);return c}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const stamp=()=>"qr-"+tab+"-"+Date.now().toString(36);
function toast(m){$("warn").textContent=m;setTimeout(render,1800)}

/* history */
const IDS=[...document.querySelectorAll("input[id],select[id],textarea[id]")].map(e=>e.id);
function save(){try{const v={};IDS.forEach(i=>v[i]=$(i).value);const h=JSON.parse(localStorage.getItem("qrs_h")||"[]").filter(x=>x.p!=BUILD[tab]());h.unshift({t:tab,p:BUILD[tab](),v,d:Date.now()});localStorage.setItem("qrs_h",JSON.stringify(h.slice(0,8)));hist()}catch(e){}}
function hist(){let h=[];try{h=JSON.parse(localStorage.getItem("qrs_h")||"[]")}catch(e){}
 $("hist").hidden=!h.length;const box=$("hl");box.innerHTML="";
 h.forEach(x=>{const b=document.createElement("button");b.textContent=x.t.toUpperCase()+" · "+x.p.replace(/\s+/g," ").slice(0,48);b.onclick=()=>{IDS.forEach(i=>{if(x.v[i]!=null)$(i).value=x.v[i]});go(x.t)};box.appendChild(b)})}
function go(t){tab=t;document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.p==t));document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t==t));render()}

TABS.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.dataset.t=k;b.role="tab";b.onclick=()=>go(k);$("tabs").appendChild(b)});
document.addEventListener("input",render);
$("eye").onclick=()=>{const p=$("pw"),s=p.type=="password";p.type=s?"text":"password";$("eye").textContent=s?"Hide":"Show"};
$("gen").onclick=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789",r=crypto.getRandomValues(new Uint32Array(16));$("pw").value=[...r].map(x=>A[x%A.length]).join("");$("pw").type="text";$("eye").textContent="Hide";render()};
$("png").onclick=()=>full().toBlob(b=>{dl(b,stamp()+".png");save()});
$("svg").onclick=()=>{dl(new Blob([toSVG(qr,+$("mar").value,$("fg").value,$("bg").value,+$("dot").value)],{type:"image/svg+xml"}),stamp()+".svg");save()};
$("cp").onclick=()=>full().toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);toast("Copied to clipboard");save()}catch(e){toast("Copy is blocked here. Use PNG instead.")}});
$("pt").onclick=()=>{$("pr").querySelector("img").src=full().toDataURL();save();setTimeout(()=>print(),80)};
$("verBtn").textContent="v"+VERSION;
$("logb").innerHTML=CHANGELOG.map(r=>`<div class="rel"><h3>v${r.v}</h3><small>${r.d}</small><ul>${r.n.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("");
$("verBtn").onclick=()=>$("log").showModal();$("logx").onclick=()=>$("log").close();
const root=document.documentElement;
let th;try{th=localStorage.getItem("qrs_t")}catch(e){}
root.dataset.theme=th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
$("theme").onclick=()=>{const t=root.dataset.theme=="dark"?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("qrs_t",t)}catch(e){}};
hist();go("link");
</script>
</body>
</html>
